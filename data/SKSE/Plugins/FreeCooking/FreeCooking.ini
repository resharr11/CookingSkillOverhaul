; Cooking Skill Overhaul settings. The in-game pages (SKSE Menu Framework: Cooking Skill Overhaul > Cooking, Survival Mode) change
; these and save this file. 1 = on, 0 = off.


[Cooking]

; Cooking in the vanilla Skills menu, right of Alchemy (needs a game restart; not used when another mod replaces the Skills menu)
bShowInSkillsMenu = true


[SharedTable]

; how far (in metres) a following follower can be and still share your meals
fRangeMetres = 50.000000


[Survival]

; Cooking Skill Overhaul's Survival Mode features (bHunger, bSpicyCold, bSpicyWater, bCampRest, bCampRestRested, bSteppedDrains,
; bHeartyRegen, bDragonWarmth, bThirst, bAfflictions; 1 on, 0 off) are left out on purpose: a missing line follows
; Cooking Skill Overhaul's default, which depends on the other survival mods it finds. The Survival Mode page writes the ones you change.

; how much alcohol quenches thirst: 0 as much as any drink, 1 half as much, 2 a fifth as much
iAlcohol = 0
