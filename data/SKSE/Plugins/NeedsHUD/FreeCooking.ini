; Cooking Skill Overhaul for NeedsHUD (its config file format): the thirst tile reads [Thirst] while our thirst runs;
; the thermometer reads [ColdProtection] always (Spicy)
[Mod]
Plugin     = FreeCooking.esp
Name       = Cooking Skill Overhaul
Running    = 0xA91      ; FC_ThirstStage: -1 while Cooking Skill Overhaul's thirst is off
RunningMin = 0

[Thirst]
Value     = 0xA90       ; FC_Thirst, 0 (just drank) to 1000
Direction = rising
Stages    = 0, 80, 160, 340, 520, 770, 1000
Names     = Quenched, Hydrated, Thirsty, Parched, Dry, Dehydrated
Bonus     = first

[ColdProtection]
StageShift        = 0xAA8   ; FC_SpicyShift: every place counts this many cold stages warmer (0-4, the Spicy level)
FreezingWaterSafe = 0xAA9   ; FC_SpicyWaterSafe: 1 while Spicy keeps freezing water harmless
